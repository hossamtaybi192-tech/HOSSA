<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — NOIR & OR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --black:#0e0d0c; --charcoal:#1c1a18; --ivory:#faf7f2; --beige:#e9e0d0;
    --gold:#b08d57; --gold-light:#d8bd8c; --line:rgba(176,141,87,0.35);
    --danger:#a24b3f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ivory); color:var(--black); font-family:'Tajawal',sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .brand{
    font-family:'Playfair Display', serif; font-size:22px; letter-spacing:0.08em; text-align:center;
  }
  .brand span{color:var(--gold);}

  /* -------- login screen -------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    background:
      radial-gradient(circle at 20% 20%, rgba(176,141,87,0.08), transparent 40%),
      var(--black);
  }
  .login-card{
    width:100%; max-width:380px; background:var(--ivory);
    padding:50px 38px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,0.4);
  }
  .login-card .brand{color:var(--black); margin-bottom:6px;}
  .login-card .sub{
    font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--gold); margin-bottom:36px;
  }
  .field{text-align:right; margin-bottom:22px;}
  .field label{display:block; font-size:12.5px; color:#7a7469; margin-bottom:8px;}
  .field input{
    width:100%; border:none; border-bottom:1px solid var(--line); background:transparent;
    padding:10px 2px; font-family:'Tajawal',sans-serif; font-size:15px; outline:none;
    transition:border-color .3s;
  }
  .field input:focus{border-color:var(--gold);}
  .btn-gold{
    width:100%; margin-top:10px; padding:15px; border:none; cursor:pointer;
    background:var(--black); color:var(--gold-light);
    font-family:'Jost',sans-serif; letter-spacing:0.2em; font-size:12.5px; text-transform:uppercase;
    transition:background .3s;
  }
  .btn-gold:hover{background:#26221d;}
  .login-error{
    color:var(--danger); font-size:13px; margin-top:16px; min-height:18px;
  }

  /* -------- dashboard -------- */
  #dashboard{display:none;}
  header{
    background:var(--black); color:var(--ivory);
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5vw; border-bottom:1px solid var(--line);
  }
  header .brand{color:var(--ivory);}
  .logout-btn{
    font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--gold-light); background:none; border:1px solid var(--gold); padding:9px 20px; cursor:pointer;
    transition:all .3s;
  }
  .logout-btn:hover{background:var(--gold); color:var(--black);}
  main{max-width:1100px; margin:0 auto; padding:50px 5vw 100px;}

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; flex-wrap:wrap; gap:16px;
  }
  .toolbar h1{font-family:'Playfair Display', serif; font-size:26px; font-weight:500;}
  .toolbar p{color:#948d80; font-size:13.5px; margin-top:4px;}
  .btn-add{
    background:var(--gold); color:var(--black); border:none; padding:13px 26px; cursor:pointer;
    font-family:'Jost',sans-serif; letter-spacing:0.15em; font-size:12.5px; text-transform:uppercase;
    transition:background .3s;
  }
  .btn-add:hover{background:var(--gold-light);}

  .table-wrap{background:#fff; box-shadow:0 10px 40px rgba(0,0,0,0.06);}
  table{width:100%; border-collapse:collapse;}
  th{
    text-align:right; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:#948d80; padding:16px 20px; border-bottom:1px solid var(--line);
  }
  td{padding:16px 20px; border-bottom:1px solid #efe9dd; font-size:14px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .p-thumb{width:52px; height:66px; object-fit:cover; background:var(--beige);}
  .p-name{font-weight:500;}
  .p-cat{font-size:12px; color:#948d80;}
  .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{
    font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 9px; border:1px solid var(--line); color:var(--gold);
  }
  .row-actions{display:flex; gap:10px; justify-content:flex-end;}
  .icon-action{
    background:none; border:none; cursor:pointer; font-family:'Jost',sans-serif; font-size:12px;
    letter-spacing:0.05em; color:#6b665e; padding:6px 10px; border:1px solid #ddd3bd; transition:all .25s;
  }
  .icon-action:hover{border-color:var(--gold); color:var(--gold);}
  .icon-action.danger:hover{border-color:var(--danger); color:var(--danger);}
  .empty-row td{text-align:center; padding:60px 20px; color:#a39c8d;}

  /* -------- modal form -------- */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(14,13,12,0.55); z-index:300;
    align-items:center; justify-content:center; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--ivory); width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
    padding:40px 36px; box-shadow:0 30px 90px rgba(0,0,0,0.35);
  }
  .modal h2{font-family:'Playfair Display', serif; font-size:22px; margin-bottom:28px; text-align:center;}
  .form-row{margin-bottom:20px;}
  .form-row label{display:block; font-size:12.5px; color:#7a7469; margin-bottom:8px;}
  .form-row input, .form-row textarea, .form-row select{
    width:100%; border:1px solid var(--line); background:#fff; padding:11px 12px;
    font-family:'Tajawal',sans-serif; font-size:14px; outline:none; transition:border-color .3s;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{border-color:var(--gold);}
  .form-row textarea{resize:vertical; min-height:70px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .checks{display:flex; gap:22px; margin-top:6px; flex-wrap:wrap;}
  .check-item{display:flex; align-items:center; gap:8px; font-size:13.5px;}
  .check-item input{width:auto;}
  .modal-actions{display:flex; gap:12px; margin-top:30px;}
  .btn-cancel{
    flex:1; background:none; border:1px solid #cfc7b8; padding:13px; cursor:pointer;
    font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:#7a7469;
  }
  .btn-save{
    flex:2; background:var(--black); color:var(--gold-light); border:none; padding:13px; cursor:pointer;
    font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.15em; text-transform:uppercase;
  }
  .btn-save:hover{background:#26221d;}
  .form-msg{font-size:13px; margin-top:14px; text-align:center; min-height:16px;}
  .form-msg.error{color:var(--danger);}
  .form-msg.ok{color:#4a7c59;}

  @media (max-width:700px){
    .table-wrap{overflow-x:auto;}
    table{min-width:640px;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand">NOIR <span>&</span> OR</div>
    <div class="sub">لوحة الإدارة</div>
    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-gold">تسجيل الدخول</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <header>
    <div class="brand">NOIR <span>&</span> OR</div>
    <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
  </header>

  <main>
    <div class="toolbar">
      <div>
        <h1>إدارة المنتجات</h1>
        <p>أضيفي، عدّلي، أو احذفي منتجات المتجر — التغييرات تظهر مباشرة للزوار</p>
      </div>
      <button class="btn-add" id="addBtn">+ إضافة منتج جديد</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>المنتج</th>
            <th>الفئة</th>
            <th>السعر</th>
            <th>الحالة</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="productsBody">
          <tr class="empty-row"><td colspan="5">جارٍ التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ================= PRODUCT MODAL ================= -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">إضافة منتج جديد</h2>
    <form id="productForm">
      <input type="hidden" id="productId">

      <div class="form-row">
        <label>اسم المنتج</label>
        <input type="text" id="fName" required placeholder="مثال: معطف صوف كلاسيكي">
      </div>

      <div class="form-row">
        <label>الوصف</label>
        <textarea id="fDescription" placeholder="وصف قصير للمنتج..."></textarea>
      </div>

      <div class="form-row">
        <label>رابط صورة المنتج</label>
        <input type="url" id="fImage" required placeholder="https://...">
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>الفئة</label>
          <select id="fCategory" required>
            <option value="men">ملابس رجالية</option>
            <option value="women">ملابس نسائية</option>
            <option value="kids">ملابس الأطفال</option>
          </select>
        </div>
        <div class="form-row">
          <label>السعر الأصلي (د.م)</label>
          <input type="number" id="fPrice" min="0" step="0.01" required>
        </div>
      </div>

      <div class="form-row" id="salePriceRow" style="display:none;">
        <label>سعر التخفيض (د.م)</label>
        <input type="number" id="fSalePrice" min="0" step="0.01">
      </div>

      <div class="form-row">
        <label>ظهور المنتج في</label>
        <div class="checks">
          <label class="check-item"><input type="checkbox" id="fBestseller"> الأكثر مبيعًا</label>
          <label class="check-item"><input type="checkbox" id="fNew"> وصل حديثًا</label>
          <label class="check-item"><input type="checkbox" id="fSale"> التخفيضات</label>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">إلغاء</button>
        <button type="submit" class="btn-save">حفظ المنتج</button>
      </div>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>
</div>

<script>
  // ---------------- Auth ----------------
  const loginScreen = document.getElementById('loginScreen');
