<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR & OR — أزياء فاخرة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

:root{
  --black:#0e0d0c;
  --charcoal:#1c1a18;
  --ivory:#faf7f2;
  --beige:#e9e0d0;
  --gold:#b08d57;
  --gold-light:#d8bd8c;
  --line:rgba(176,141,87,.35);
  --shadow:0 20px 60px rgba(0,0,0,.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--ivory);
  color:var(--black);
  font-family:'Tajawal',sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font-family:inherit;
}

img{
  display:block;
  max-width:100%;
}

.container{
  max-width:1280px;
  margin:auto;
  padding:0 6vw;
}

.eyebrow{
  font-family:Jost,sans-serif;
  letter-spacing:.3em;
  font-size:11px;
  color:var(--gold);
}

.stitch{
  width:100%;
  height:10px;
  background-image:repeating-linear-gradient(
    90deg,
    var(--gold) 0 10px,
    transparent 10px 20px
  );
  opacity:.35;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(250,247,242,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.nav-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 6vw;
}

.brand{
  font-family:'Playfair Display',serif;
  font-size:26px;
  letter-spacing:.12em;
  text-align:center;
}

.brand span{
  color:var(--gold);
}

.brand small{
  display:block;
  font-family:Tajawal,sans-serif;
  font-size:10px;
  color:#777;
  letter-spacing:0;
}

nav ul{
  list-style:none;
  display:flex;
  gap:30px;
}

nav a{
  font-size:14px;
}

.nav-icons{
  display:flex;
  align-items:center;
  gap:20px;
}

.icon-btn{
  width:22px;
  height:22px;
  cursor:pointer;
  position:relative;
}

.icon-btn svg{
  width:100%;
  height:100%;
  stroke:var(--black);
  fill:none;
  stroke-width:1.5;
}

.cart-count{
  position:absolute;
  top:-9px;
  left:-9px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--gold);
  color:white;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.burger{
  display:none;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
}

.burger span{
  width:24px;
  height:2px;
  background:var(--black);
}

/* HERO */

.hero{
  position:relative;
  height:88vh;
  min-height:560px;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}

.hero>img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.1),
    rgba(0,0,0,.75)
  );
}

.hero-content{
  position:relative;
  z-index:2;
  width:100%;
  text-align:center;
  color:white;
  padding:0 6vw 7vw;
}

.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(45px,8vw,105px);
  letter-spacing:.05em;
  line-height:1;
  margin:20px 0;
}

.hero p{
  max-width:500px;
  margin:0 auto 30px;
  line-height:2;
  color:#eee;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:16px 38px;
  border:1px solid var(--gold-light);
  color:white;
  background:transparent;
  cursor:pointer;
  letter-spacing:.15em;
  transition:.3s;
}

.btn:hover{
  background:var(--gold);
}

/* MARQUEE */

.marquee{
  background:var(--black);
  color:var(--gold-light);
  padding:14px;
  overflow:hidden;
  white-space:nowrap;
  text-align:center;
}

/* SECTIONS */

.section{
  padding:100px 0;
}

.section-head{
  text-align:center;
  margin-bottom:55px;
}

.section-head h2{
  font-family:'Cormorant Garamond',serif;
  font-size:50px;
  font-style:italic;
  margin:10px 0;
}

.section-head p{
  color:#777;
}

/* TABS */

.tabs{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-bottom:40px;
}

.tab-btn{
  border:0;
  background:none;
  cursor:pointer;
  color:#999;
  padding:8px;
  border-bottom:1px solid transparent;
}

.tab-btn.active{
  color:var(--black);
  border-color:var(--gold);
}

/* PRODUCTS */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
}

.card{
  cursor:pointer;
}

.card-img{
  position:relative;
  overflow:hidden;
  aspect-ratio:3/4;
  background:var(--beige);
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.6s;
}

.card:hover .card-img img{
  transform:scale(1.07);
}

.card-tag{
  position:absolute;
  top:14px;
  right:14px;
  background:white;
  padding:6px 10px;
  font-size:11px;
}

.card-tag.sale{
  background:var(--black);
  color:var(--gold-light);
}

.quick-add{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:14px;
  text-align:center;
  background:rgba(14,13,12,.9);
  color:white;
  transform:translateY(100%);
  transition:.3s;
}

.card:hover .quick-add{
  transform:translateY(0);
}

.card-info{
  padding-top:15px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.card-info h4{
  font-size:15px;
}

.cat{
  font-size:12px;
  color:#999;
}

.price{
  color:var(--gold);
  white-space:nowrap;
}

.price del{
  color:#aaa;
  margin-right:5px;
  font-size:11px;
}

/* SALE */

.sale-banner{
  min-height:430px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  overflow:hidden;
}

.sale-banner img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(.45);
}

.sale-banner-content{
  position:relative;
  z-index:2;
}

.sale-banner h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(38px,6vw,70px);
  margin:15px 0;
}

.sale-banner em{
  color:var(--gold-light);
}

/* TESTIMONIALS */

.testi-wrap{
  background:var(--beige);
}

.testi-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
}

.testi-card{
  background:var(--ivory);
  padding:35px;
  text-align:center;
  box-shadow:var(--shadow);
}

.stars{
  color:var(--gold);
  margin-bottom:20px;
}

.testi-card p{
  font-family:'Cormorant Garamond',serif;
  font-size:19px;
  font-style:italic;
  line-height:1.8;
  margin-bottom:20px;
}

/* NEWSLETTER */

.newsletter{
  background:var(--black);
  color:white;
  text-align:center;
  padding:80px 20px;
}

.newsletter h3{
  font-family:'Playfair Display',serif;
  font-size:36px;
  margin-bottom:15px;
}

.newsletter p{
  color:#aaa;
  margin-bottom:30px;
}

.newsletter-form{
  max-width:450px;
  margin:auto;
  display:flex;
  border-bottom:1px solid var(--gold);
}

.newsletter-form input{
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:white;
  padding:14px;
}

.newsletter-form button{
  border:0;
  background:none;
  color:var(--gold-light);
  cursor:pointer;
}

/* FOOTER */

footer{
  background:var(--charcoal);
  color:#ccc;
  padding:70px 6vw 0;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1.2fr;
  gap:40px;
  padding-bottom:50px;
}

.footer-col h5{
  color:var(--gold-light);
  margin-bottom:20px;
}

.footer-col ul{
  list-style:none;
}

.footer-col li{
  margin-bottom:12px;
}

.footer-col a{
  color:#aaa;
}

  border-top:1px solid #333;
  padding:
