<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR & OR — لوحة الإدارة</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#f5f1ea;
  color:#171513;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

header{
  background:#11100e;
  color:white;
  padding:22px;
  margin-bottom:25px;
}

header h1{
  color:#d8bd8c;
  margin-bottom:8px;
}

header p{
  color:#aaa;
}

.panel{
  background:white;
  padding:25px;
  margin-bottom:25px;
  border:1px solid #ddd;
}

.panel h2{
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form-group{
  margin-bottom:15px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  background:#fff;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#b08d57;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin:15px 0;
}

.check{
  display:flex;
  align-items:center;
  gap:7px;
}

.check input{
  width:auto;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  padding:13px 22px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.save-btn{
  background:#11100e;
  color:white;
}

.save-btn:hover{
  background:#b08d57;
}

.cancel-btn{
  background:#ddd;
}

.product-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.product{
  border:1px solid #ddd;
  background:#fff;
  overflow:hidden;
}

.product img{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:15px;
}

.product-info h3{
  margin-bottom:8px;
}

.price{
  color:#b08d57;
  font-weight:bold;
  margin:8px 0;
}

.badges{
  font-size:12px;
  color:#777;
  margin-bottom:12px;
}

.product-buttons{
  display:flex;
  gap:8px;
}

.edit{
  flex:1;
  background:#eee;
}

.delete{
  flex:1;
  background:#171513;
  color:white;
}

.status{
  padding:12px;
  margin-bottom:20px;
  display:none;
}

.status.success{
  display:block;
  background:#e8f5e9;
  color:#176b25;
}

.status.error{
  display:block;
  background:#ffebee;
  color:#b71c1c;
}

.login{
  max-width:450px;
  margin:80px auto;
  background:white;
  padding:30px;
}

.login h1{
  margin-bottom:20px;
  text-align:center;
}

.hidden{
  display:none !important;
}

.empty{
  color:#777;
  text-align:center;
  padding:30px;
}

.error-text{
  color:#b00;
  padding:20px;
  text-align:center;
}

@media(max-width:800px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .product-list{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:500px){

  .container{
    padding:15px;
  }

  .product-list{
    grid-template-columns:1fr;
  }

  .login{
    margin:30px 15px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login">

  <h1>NOIR & OR</h1>

  <p style="text-align:center;margin-bottom:20px">
    لوحة الإدارة
  </p>

  <div id="loginStatus" class="status"></div>

  <div class="form-group">

    <label>البريد الإلكتروني</label>

    <input
      type="email"
      id="adminEmail"
      placeholder="admin@email.com"
      autocomplete="email"
    >

  </div>

  <div class="form-group">

    <label>كلمة المرور</label>

    <input
      type="password"
      id="adminPassword"
      autocomplete="current-password"
    >

  </div>

  <button
    class="save-btn"
    style="width:100%"
    id="loginBtn"
  >
    تسجيل الدخول
  </button>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage" class="hidden">

<header>

  <div class="container">

    <h1>NOIR & OR</h1>

    <p>
      لوحة إدارة المنتجات
    </p>

  </div>

</header>


<div class="container">

  <div id="status" class="status"></div>


  <!-- ================= ADD PRODUCT ================= -->

  <div class="panel">

    <h2 id="formTitle">
      إضافة منتج جديد
    </h2>

    <form id="productForm">

      <input type="hidden" id="productId">

      <div class="form-grid">

        <div class="form-group">

          <label>اسم المنتج</label>

          <input
            type="text"
            id="productName"
            placeholder="مثال: قميص فاخر"
            required
          >

        </div>


        <div class="form-group">

          <label>الفئة</label>

          <select
            id="productCategory"
            required
          >

            <option value="">
              اختر الفئة
            </option>

            <option value="men">
              رجال
            </option>

            <option value="women">
              نساء
            </option>

            <option value="kids">
              أطفال
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>السعر</label>

          <input
            type="number"
            id="productPrice"
            min="0"
            step="0.01"
            placeholder="500"
            required
          >

        </div>


        <div class="form-group">

          <label>سعر التخفيض</label>

          <input
            type="number"
            id="productSalePrice"
            min="0"
            step="0.01"
            placeholder="400"
          >

        </div>


        <div class="form-group full">

          <label>رابط صورة المنتج</label>

          <input
            type="url"
            id="productImage"
            placeholder="https://..."
            required
          >

        </div>


        <div class="form-group full">

          <label>الوصف</label>

          <textarea
            id="productDescription"
            placeholder="اكتب وصف المنتج هنا..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>المقاسات</label>

          <input
            type="text"
            id="productSize"
            placeholder="S, M, L, XL"
          >

        </div>

      </div>


      <div class="checks">

        <label class="check">

          <input
            type="checkbox"
            id="isNew"
          >

          جديد

        </label>


        <label class="check">

          <input
            type="checkbox"
            id="isBestseller"
          >

          الأكثر مبيعًا

        </label>


        <label class="check">

          <input
            type="checkbox"
            id="isSale"
          >

          تخفيض

        </label>

      </div>


      <div class="buttons">

        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          إضافة المنتج
        </button>


        <button
          type="button"
          class="cancel-btn hidden"
          id="cancelEdit"
        >
          إلغاء التعديل
        </button>

      </div>

    </form>

  </div>


  <!-- ================= PRODUCTS ================= -->

  <div class="panel">

    <h2>
      المنتجات الموجودة
    </h2>

    <div
      id="productsList"
      class="product-list"
    >

      <p class="empty">
        جاري تحميل المنتجات...
      </p>

    </div>

  </div>


  <!-- ================= LOGOUT ================= -->

  <div class="panel">

    <button
      class="cancel-btn"
      id="logoutBtn"
    >
      تسجيل الخروج
    </button>

  </div>

</div>

</div>


<script>

/* =====================================================
   NOIR & OR ADMIN
===================================================== */


/* ================= FIREBASE ================= */

let firebaseReady =
  typeof firebase !== "undefined" &&
  typeof db !== "undefined" &&
  typeof auth !== "undefined";

let editingId = null;


/* ================= ELEMENTS ================= */

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const loginStatus =
  document.getElementById("loginStatus");

const statusBox =
  document.getElementById("status");


/* ================= STATUS ================= */

function showStatus(message, type = "success") {

  statusBox.textContent = message;

  statusBox.className =
    "status " + type;

  setTimeout(function(){

    statusBox.className = "status";

  }, 3500);
}


function showLoginStatus(message){

  loginStatus.textContent = message;

  loginStatus.className =
    "status error";
}


/* ================= LOGIN ================= */

document
  .getElementById("loginBtn")
  .addEventListener("click", function(){

    const email =
      document
        .getElementById("adminEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("adminPassword")
        .value;


    if(!email || !password){

      showLoginStatus(
        "أدخل البريد الإلكتروني وكلمة المرور."
      );

      return;
    }


    if(!firebaseReady){

      showLoginStatus(
        "Firebase غير متصل. تأكد من firebase-config.js"
      );

      return;
    }


    const loginButton =
      document.getElementById("loginBtn");

    loginButton.disabled = true;

    loginButton.textContent =
      "جاري تسجيل الدخول...";


    auth
      .signInWithEmailAndPassword(
        email,
        password
      )

      .then(function(){

        loginPage.classList.add("hidden");

        adminPage.classList.remove("hidden");

        loadProducts();

      })

      .catch(function(error){

        console.error(
          "Firebase Login Error:",
          error
        );


        let message =
          "حدث خطأ أثناء تسجيل الدخول.";


        if(
          error.code ===
          "auth/invalid-credential"
        ){

          message =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }

        else if(
          error.code ===
          "auth/user-not-found"
        ){

          message =
            "هذا البريد الإلكتروني غير موجود في Firebase.";

        }

        else if(
          error.code ===
          "auth/wrong-password"
        ){

          message =
            "كلمة المرور غير صحيحة.";

        }

        else if(
          error.code ===
          "auth/invalid-email"
        ){

          message =
            "صيغة البريد الإلكتروني غير صحيحة.";

        }

        else if(
          error.code ===
          "auth/too-many-requests"
        ){

          message =
            "تمت محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.";

        }

        else if(
          error.code ===
          "auth/network-request-failed"
        ){

          message =
            "تحقق من اتصال الهاتف بالإنترنت.";

        }


        showLoginStatus(message);

      })

      .finally(function(){

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

      });

  });


/* ================= AUTH ================= */

if(firebaseReady){

  auth.onAuthStateChanged(function(user){

    if(user){

      loginPage.classList.add("hidden");

      adminPage.classList.remove("hidden");

      loadProducts();

    }

    else{

      loginPage.classList.remove("hidden");

      adminPage.classList.add("hidden");

    }

  });

}


/* ================= SAVE PRODUCT ================= */

document
  .getElementById("productForm")
  .addEventListener("submit", function(event){

    event.preventDefault();


    if(!firebaseReady){

      showStatus(
        "Firebase غير متصل.",
        "error"
      );

      return;
    }


    const name =
      document
        .getElementById("productName")
        .value
        .trim();


    const category =
      document
        .getElementById("productCategory")
        .value;


    const price =
      Number(
        document
          .getElementById("productPrice")
          .value
      );


    const salePriceValue =
      document
        .getElementById("productSalePrice")
        .value;


    const salePrice =
      salePriceValue
        ? Number(salePriceValue)
        : null;


    const image =
      document
        .getElementById("productImage")
        .value
        .trim();


    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();


    const size =
      document
        .getElementById("productSize")
        .value
        .trim();


    const isNew =
      document
        .getElementById("isNew")
        .checked;


    const isBestseller =
      document
        .getElementById("isBestseller")
        .checked;


    const isSale =
      document
        .getElementById("isSale")
        .checked;


    if(
      !name ||
      !category ||
      price <= 0 ||
      !image
    ){

      showStatus(
        "املأ اسم المنتج والفئة والسعر والصورة.",
        "error"
      );

      return;
    }


    if(isSale){

      if(
        !salePrice ||
        salePrice >= price
      ){

        showStatus(
          "سعر التخفيض يجب أن يكون أقل من السعر الأصلي.",
          "error"
        );

        return;
      }

    }


    const productData = {

      name:name,

      category:category,

      price:price,

      salePrice:
        isSale
          ? salePrice
          : null,

      isSale:isSale,

      image:image,

      description:description,

      size:size,

      isNew:isNew,

      isBestseller:isBestseller

    };


    const saveButton =
      document.getElementById("saveBtn");


    saveButton.disabled = true;

    saveButton.textContent =
      "جاري الحفظ...";


    /* ================= UPDATE ================= */

    if(editingId){

      db.collection("products")
        .doc(editingId)
        .update(productData)

        .then(function(){

          showStatus(
            "تم تعديل المنتج بنجاح ✓"
          );

          resetForm();

        })

        .catch(function(error){

          console.error(error);

          showStatus(
            "حدث خطأ أثناء تعديل المنتج.",
            "error"
          );

        })

        .finally(function(){

          saveButton.disabled = false;

          saveButton.textContent =
            "إضافة المنتج";

        });

    }


    /* ================= ADD ================= */

    else{

      productData.createdAt =
        firebase.firestore.FieldValue
          .serverTimestamp();


      db.collection("products")
        .add(productData)

        .then(function(){

          showStatus(
            "تمت إضافة المنتج بنجاح ✓"
          );

          resetForm();

        })

        .catch(function(error){

          console.error(error);

          showStatus(
            "حدث خطأ أثناء إضافة المنتج.",
            "error"
          );

        })

        .finally(function(){

          saveButton.disabled = false;

          saveButton.textContent =
            "إضافة المنتج";

        });

    }

  });


/* ================= LOAD PRODUCTS ================= */

function loadProducts(){

  if(!firebaseReady) return;


  db.collection("products")
    .orderBy("createdAt", "desc")

    .onSnapshot(

      function(snapshot){

        const list =
          document.getElementById(
            "productsList"
          );


        if(snapshot.empty){

          list.innerHTML = `
            <p class="empty">
              لا توجد منتجات حتى الآن.
            </p>
          `;

          return;
        }


        let html = "";


        snapshot.forEach(function(doc){

          const product =
            doc.data();


          const price =
            Number(product.price || 0);


          const salePrice =
            Number(product.salePrice || 0);


          const image =
            product.image ||
            "https://via.placeholder.com/600x800";


          let priceHTML = "";


          if(
            product.isSale &&
            salePrice > 0
          ){

            priceHTML = `
              ${money(salePrice)}

              <del
                style="
                  color:#999;
                  font-size:11px;
                  margin-right:5px;
                "
              >
                ${money(price)}
              </del>
            `;

          }

          else{

            priceHTML =
              money(price);

          }


          let badges = "";


          if(product.isNew){

            badges += "جديد · ";

          }


          if(product.isBestseller){

            badges += "الأكثر مبيعًا · ";

          }


          if(product.isSale){

            badges += "تخفيض";

          }


          html += `

            <div class="product">

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(
                  product.name || "منتج"
                )}"
                onerror="
                  this.src='https://via.placeholder.com/600x800';
                "
              >


              <div class="product-info">

                <h3>
                  ${escapeHTML(
                    product.name || "منتج"
                  )}
                </h3>


                <div>
                  الفئة:
                  ${categoryName(
                    product.category
                  )}
                </div>


                <div class="price">
                  ${priceHTML}
                </div>


                <div class="badges">
                  ${badges}
                </div>


                <div class="product-buttons">

                  <button
                    class="edit"
                    onclick="editProduct('${doc.id}')"
                  >
                    تعديل
                  </button>


                  <button
                    class="delete"
                    onclick="deleteProduct('${doc.id}')"
                  >
                    حذف
                  </button>

                </div>

              </div>

            </div>

          `;

        });


        list.innerHTML = html;

      },


      function(error){

        console.error(
          "Firestore Error:",
          error
        );


        document
          .getElementById("productsList")
          .innerHTML = `
            <p class="error-text">
              تعذر تحميل المنتجات.
              تأكد من قواعد Firestore.
            </p>
          `;

      }

    );

}


/* ================= EDIT ================= */

window.editProduct = function(id){

  db.collection("products")
    .doc(id)
    .get()

    .then(function(doc){

      if(!doc.exists){

        showStatus(
          "المنتج غير موجود.",
          "error"
        );

        return;
      }


      const product =
        doc.data();


      editingId = id;


      document
        .getElementById("productName")
        .value =
          product.name || "";


      document
        .getElementById("productCategory")
        .value =
          product.category || "";


      document
        .getElementById("productPrice")
        .value =
          product.price || "";


      document
        .getElementById("productSalePrice")
        .value =
          product.salePrice || "";


      document
        .getElementById("productImage")
        .value =
          product.image || "";


      document
        .getElementById("productDescription")
        .value =
          product.description || "";


      document
        .getElementById("productSize")
        .value =
          product.size || "";


      document
        .getElementById("isNew")
        .checked =
          product.isNew === true;


      document
        .getElementById("isBestseller")
        .checked =
          product.isBestseller === true;


      document
        .getElementById("isSale")
        .checked =
          product.isSale === true;


      document
        .getElementById("formTitle")
        .textContent =
          "تعديل المنتج";


      document
        .getElementById("saveBtn")
        .textContent =
          "حفظ التعديلات";


      document
        .getElementById("cancelEdit")
        .classList.remove("hidden");


      window.scrollTo({

        top:0,

        behavior:"smooth"

      });

    })

    .catch(function(error){

      console.error(error);

      showStatus(
        "تعذر فتح المنتج.",
        "error"
      );

    });

};


/* ================= DELETE ================= */

window.deleteProduct = function(id){

  const confirmation =
    confirm(
      "هل أنت متأكد من حذف هذا المنتج؟"
    );


  if(!confirmation) return;


  db.collection("products")
    .doc(id)
    .delete()

    .then(function(){

      showStatus(
        "تم حذف المنتج بنجاح."
      );

    })

    .catch(function(error){

      console.error(error);

      showStatus(
        "تعذر حذف المنتج.",
        "error"
      );

    });

};


/* ================= RESET ================= */

function resetForm(){

  editingId = null;


  document
    .getElementById("productForm")
    .reset();


  document
    .getElementById("formTitle")
    .textContent =
      "إضافة منتج جديد";


  document
    .getElementById("saveBtn")
    .textContent =
      "إضافة المنتج";


  document
    .getElementById("cancelEdit")
    .classList.add("hidden");

}


document
  .getElementById("cancelEdit")
  .addEventListener(
    "click",
    resetForm
  );


/* ================= LOGOUT ================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    function(){

      auth
        .signOut()

        .catch(function(error){

          console.error(error);

        });

    }
  );


/* ================= HELPERS ================= */

function money(number){

  return Number(number || 0)
    .toLocaleString("ar-MA") +
    " د.م";

}


function categoryName(category){

  if(category === "men")
    return "رجال";

  if(category === "women")
    return "نساء";

  if(category === "kids")
    return "أطفال";

  return "غير محدد";

}


function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
